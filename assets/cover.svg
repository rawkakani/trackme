<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- TrackMe on the left -->
  <g transform="translate(96,180)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="120" font-weight="900" fill="#111111" letter-spacing="-5">TrackMe</text>
    <text x="0" y="72" font-size="34" font-weight="500" fill="#6b7280">Service delivery tracking</text>
    <text x="0" y="120" font-size="24" font-weight="500" fill="#6b7280">Live queue, ETA, and technician updates</text>
  </g>

  <!-- Queue components on the right -->
  <g transform="translate(980,72)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Queue position -->
    <text x="0" y="110" font-size="112" font-weight="900" fill="#111111" letter-spacing="-4">3rd</text>
    <text x="0" y="150" font-size="28" font-weight="500" fill="#6b7280">of 7 today · 2 ahead of you</text>
    <rect x="0" y="170" width="420" height="10" rx="5" fill="#e5e7eb"/>
    <rect x="0" y="170" width="180" height="10" rx="5" fill="#111111"/>

    <!-- ETA card -->
    <g transform="translate(0,230)">
      <rect x="0" y="0" width="420" height="150" rx="24" fill="#f3f4f6"/>
      <text x="28" y="46" font-size="22" font-weight="500" fill="#6b7280">Most likely</text>
      <text x="28" y="96" font-size="52" font-weight="800" fill="#111111">10:40</text>
      <text x="28" y="128" font-size="20" font-weight="500" fill="#6b7280">Estimate from the queue</text>
    </g>

    <!-- Your turn card -->
    <g transform="translate(0,410)">
      <rect x="0" y="0" width="420" height="170" rx="24" fill="#f3f4f6"/>
      <text x="28" y="44" font-size="22" font-weight="500" fill="#6b7280">On the way</text>
      <text x="28" y="104" font-size="64" font-weight="900" fill="#111111">12 min</text>
      <text x="28" y="142" font-size="22" font-weight="600" fill="#111111">Sipho is on the way · 4.2 km away</text>
    </g>

    <!-- Waiting state hint -->
    <g transform="translate(0,610)">
      <rect x="0" y="0" width="420" height="96" rx="24" fill="#ffffff" stroke="#f3f4f6" stroke-width="2"/>
      <text x="28" y="42" font-size="20" font-weight="500" fill="#6b7280">Status</text>
      <text x="28" y="72" font-size="26" font-weight="700" fill="#111111">Waiting · window 08:00–12:00</text>
    </g>
  </g>
</svg>
